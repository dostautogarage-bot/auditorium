{% extends 'booking/base.html' %}
{% block title %}Calendar - Auditorium{% endblock %}

{% block extra_css %}
<style>
    #calendar { padding: 15px; border-radius: var(--r-xl); border: 1.5px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .fc { font-family: 'Urbanist', sans-serif; border: none !important; }
    .fc a { text-decoration: none !important; color: inherit !important; }
    .fc-col-header-cell-cushion { color: var(--slate-600); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; }
    
    .fc-button {
        background: #F1F5F9 !important; border: none !important;
        color: var(--slate-600) !important; font-weight: 700 !important;
        border-radius: 10px !important; padding: 6px 14px !important;
        font-size: 0.8rem !important; transition: 0.2s !important;
        margin: 0 2px !important;
    }
    .fc-button:hover { background: #E2E8F0 !important; }
    .fc-button-primary:not(:disabled).fc-button-active {
        background: var(--primary) !important; color: white !important;
    }

    .fc-event {
        background: var(--primary-gradient) !important; border: none !important;
        border-radius: 6px !important; padding: 2px 6px !important;
        font-weight: 700 !important; font-size: 0.7rem !important;
        box-shadow: 0 4px 10px rgba(20, 184, 166, 0.2);
        cursor: pointer;
    }

    .fc-day-today { background: linear-gradient(135deg, rgba(20, 184, 166, 0.05) 0%, rgba(20, 184, 166, 0.1) 100%) !important; }
    .fc-day-past { background-color: #F8FAFC !important; opacity: 0.5; cursor: not-allowed !important; }
    .fc-day-past .fc-daygrid-day-number { color: var(--slate-400) !important; }
    
    /* Dates from other months - transparent style */
    .fc-day-other { opacity: 0.4 !important; }
    .fc-day-other .fc-daygrid-day-number { 
        color: var(--slate-400) !important; 
        font-weight: 600 !important;
        opacity: 0.6 !important;
    }
    .fc-day-other .fc-daygrid-day-top { opacity: 0.5 !important; }
    
    /* Week view column header styling */
    .fc-col-header-cell-cushion { 
        padding: 8px 0 !important;
        display: block !important;
    }
    .fc-timegrid-axis-cushion {
        font-size: 0.7rem !important;
        font-weight: 700 !important;
        color: var(--slate-400) !important;
    }

    .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 800 !important; letter-spacing: -0.02em; }

    #yearSelector {
        border: 1px solid #E2E8F0; padding: 8px 16px;
        font-weight: 700; color: var(--slate-600); border-radius: 10px;
        background: white; cursor: pointer; font-size: 0.85rem;
    }

    .btn-round {
        width: 48px; height: 48px; border-radius: 50%;
        padding: 0; display: flex; align-items: center; justify-content: center;
        box-shadow: var(--shadow-md);
    }
</style>
{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-5 px-1">
        <div>
            <h1 style="font-size:1.5rem; font-weight:800; margin:0; letter-spacing:-0.04em;">Calendar</h1>
            <p class="text-muted small fw-medium">Auditorium Schedule</p>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="d-none d-sm-flex align-items-center gap-3" style="background: rgba(255,255,255,0.6); backdrop-filter: blur(10px); padding: 8px 18px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: 0.3s;" onmouseover="this.style.background='white'; this.style.boxShadow='0 8px 25px rgba(0,0,0,0.06)';" onmouseout="this.style.background='rgba(255,255,255,0.6)'; this.style.boxShadow='0 4px 15px rgba(0,0,0,0.03)';">
                <span style="font-size: 0.65rem; font-weight: 900; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap;">Jump to Year</span>
                <div class="position-relative" style="min-width: 70px;">
                    <select id="yearSelector" class="form-select border-0 p-0 pe-4 shadow-none" style="font-size: 1rem; font-weight: 800; color: var(--primary); background: transparent; cursor: pointer; -webkit-appearance: none; -moz-appearance: none; appearance: none;"></select>
                    <i class="bi bi-chevron-down position-absolute top-50 end-0 translate-middle-y" style="font-size: 0.8rem; color: var(--primary); pointer-events: none; margin-top: 1px;"></i>
                </div>
            </div>
        </div>
    </div>

    <div id="calendar" style="box-shadow: var(--shadow);"></div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var yearSelector = document.getElementById('yearSelector');
    
    const currentYear = new Date().getFullYear();
    for (let i = currentYear - 3; i <= currentYear + 5; i++) {
        const option = document.createElement('option');
        option.value = i; option.textContent = i;
        if (i === currentYear) option.selected = true;
        yearSelector.appendChild(option);
    }

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },
        dayHeaderFormat: { weekday: 'short' },
        views: {
            timeGridWeek: {
                dayHeaderFormat: { weekday: 'short', day: 'numeric', month: 'short', omitCommas: true }
            }
        },
        events: '{% url "booking_api" %}',
        selectable: true,
        selectAllow: function(selectInfo) {
            return selectInfo.start >= new Date().setHours(0,0,0,0);
        },
        dateClick: function(info) {
            const today = new Date().setHours(0,0,0,0);
            const clickedDate = new Date(info.date).setHours(0,0,0,0);
            if (clickedDate < today) return;
            
            document.getElementById('modal_date_base').value = info.dateStr;
            const modal = new bootstrap.Modal(document.getElementById('createBookingModal'));
            modal.show();
        },
        eventClick: function(info) {
            triggerDetailModal(info.event);
            info.jsEvent.preventDefault();
        },
        datesSet: function() {
            const calendarYear = calendar.getDate().getFullYear();
            if (yearSelector.value != calendarYear) yearSelector.value = calendarYear;
        },
        height: 'auto',
        eventTimeFormat: { hour: 'numeric', minute: '2-digit', meridiem: 'short' }
    });

    calendar.render();

    yearSelector.addEventListener('change', function() {
        const date = calendar.getDate();
        date.setFullYear(this.value);
        calendar.gotoDate(date);
    });
});
</script>
{% endblock %}
