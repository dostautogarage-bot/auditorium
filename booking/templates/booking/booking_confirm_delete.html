{% extends 'booking/base.html' %}
{% block title %}Delete Booking - Audy{% endblock %}

{% block content %}
<div class="fade-in d-flex align-items-center justify-content-center" style="min-height: 80vh; padding: 20px;">
    <div class="modal-content-premium" style="max-width: 440px; width: 100%;">
        <div class="modal-header-premium">
            <h5 class="fw-800 mb-0">Delete Booking?</h5>
        </div>

        <div class="modal-body-premium d-flex flex-column align-items-center justify-content-center text-center py-4">
            <div class="mb-4 d-flex align-items-center justify-content-center" style="width: 80px; height: 80px; background: #FEF2F2; color: #DC2626; border-radius: 24px;">
                <i class="bi bi-trash3-fill fs-1"></i>
            </div>
            
            <p class="text-muted fw-medium mb-0">
                Are you sure you want to delete <br>
                <strong style="color: var(--ink);">"{{ booking.title }}"</strong>?
            </p>
            <p class="small text-danger fw-bold mt-2 mb-0">This action cannot be undone.</p>
        </div>

        <div class="modal-footer-premium flex-column gap-2">
            <form method="POST" class="w-100">
                {% csrf_token %}
                <button type="submit" class="btn-app w-100" style="background:#FEF2F2;color:#DC2626;font-weight:900;">
                    Yes, Delete Permanent
                </button>
            </form>
            <a href="{% url 'booking_list' %}" class="btn-app btn-app-ghost w-100 text-decoration-none">
                No, Keep Booking
            </a>
        </div>
    </div>
</div>
{% endblock %}
