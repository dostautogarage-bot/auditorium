{% extends 'booking/base.html' %}
{% block title %}Delete Booking - ABC Auditorium{% endblock %}

{% block content %}
<div class="fade-in d-flex align-items-center justify-content-center" style="min-height: 80vh; padding: 20px;">
    <!-- MATCHING SQUARE MODAL DESIGN -->
    <div class="modal-content-premium" style="max-width: 440px; width: 100%; height: 440px; display: flex; flex-direction: column; box-shadow: var(--shadow-premium);">
        
        <div class="modal-header-premium" style="flex-shrink: 0; padding: 40px 32px 10px;">
            <h4 class="fw-800 mb-0">Delete Booking?</h4>
        </div>

        <div class="modal-body-premium d-flex flex-column align-items-center justify-content-center text-center" style="flex-grow: 1; padding: 0 40px;">
            <div class="mb-4 d-flex align-items-center justify-content-center" style="width: 80px; height: 80px; background: #FFF1F1; color: #D32F2F; border-radius: 24px;">
                <i class="bi bi-trash3-fill fs-1"></i>
            </div>
            
            <p class="text-muted fw-medium mb-0">
                Are you sure you want to delete <br>
                <strong class="text-dark">"{{ booking.title }}"</strong>?
            </p>
            <p class="small text-danger fw-bold mt-2">This action cannot be undone.</p>
        </div>

        <div class="modal-footer-premium flex-column gap-2" style="flex-shrink: 0; padding: 24px 32px 40px;">
            <form method="POST" class="w-100">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 py-3" style="background: #D32F2F; border-radius: 20px; box-shadow: 0 8px 16px rgba(211, 47, 47, 0.2);">
                    Yes, Delete Permanent
                </button>
            </form>
            <a href="{% url 'booking_list' %}" class="btn btn-light w-100 py-3" style="border-radius: 20px;">
                No, Keep Booking
            </a>
        </div>
    </div>
</div>
{% endblock %}
